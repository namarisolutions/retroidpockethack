; CSK sensor firmware: passive WiFi + BLE sniffer, JSON lines over USB serial.
;
;   pio run -t upload                  (DOIT ESP32 DevKit V1 — default)
;   pio run -e esp32dev -t upload      (other classic ESP32-WROOM boards)
;   pio run -e esp32s3 -t upload
;   pio run -e esp32c3 -t upload
;   pio device monitor                 (watch raw output)
;
; ESP32-S2 has no Bluetooth: use env esp32s2 (WiFi only).

[platformio]
default_envs = devkitv1

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 921600
upload_speed = 460800  ; CP2102 on DevKit V1 is more reliable here
board_build.partitions = huge_app.csv
lib_deps = h2zero/NimBLE-Arduino@1.4.3
build_flags =
  -DCORE_DEBUG_LEVEL=0
  -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED

[env:devkitv1]
board = esp32doit-devkit-v1
build_flags = ${env.build_flags} -DCSK_LED_PIN=2

[env:esp32dev]
board = esp32dev

[env:esp32s3]
board = esp32-s3-devkitc-1

[env:esp32c3]
board = esp32-c3-devkitm-1

[env:esp32s2]
board = esp32-s2-saola-1
lib_deps =
build_flags = -DCORE_DEBUG_LEVEL=0 -DCSK_NO_BLE
